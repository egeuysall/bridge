name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver to release (blank bumps the patch version)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve version and build release assets
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          current="$(node -e "const v=require('./cli/version.json').version;if(!/^\d+\.\d+\.\d+$/.test(v)) process.exit(1); process.stdout.write(v)")"
          requested="${REQUESTED_VERSION:-}"
          if [ -n "${requested}" ]; then
            [[ "${requested}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid semver: ${requested}" >&2; exit 1; }
            version="${requested}"
            tag="v${version}"
            git rev-parse -q --verify "refs/tags/${tag}" >/dev/null && { echo "tag already exists: ${tag}" >&2; exit 1; } || true
          else
            IFS=. read -r major minor patch <<<"${current}"
            patch="$((patch + 1))"
            version="${major}.${minor}.${patch}"
            tag="v${version}"
            while git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; do
              patch="$((patch + 1))"
              version="${major}.${minor}.${patch}"
              tag="v${version}"
            done
          fi

          node scripts/sync-cli-version.mjs "${version}"
          node scripts/build-bri-standalone.mjs

          mkdir -p dist
          for target in bun-darwin-arm64 bun-darwin-x64 bun-linux-arm64 bun-linux-x64; do
            bun build --compile --minify --target "${target}" build/cli-release/bri-standalone.ts --outfile "dist/bri-${target#bun-}"
          done
          [ "$(./dist/bri-linux-x64 --version)" = "${version}" ]
          (cd dist && sha256sum bri-* > SHA256SUMS)

          git add cli/version.json public/bri-version.json
          git commit -m "chore(cli): release ${version}"
          git tag "${tag}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "bri ${{ steps.release.outputs.tag }}" \
            --generate-notes
